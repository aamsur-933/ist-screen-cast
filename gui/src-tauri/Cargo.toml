[package]
name = "ist-screen-cast"
version = "0.1.0"
description = "IST Screen Cast: cast layar laptop ke projektor/TV (Miracast, Google Cast)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
